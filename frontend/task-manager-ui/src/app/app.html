<div class="app-shell">
  <!-- Top Navigation Header -->
  <app-navbar (openCreateModal)="handleOpenCreate()" />

  <!-- Main Dashboard Content -->
  <main class="main-layout">
    <app-task-dashboard #dashboard />
  </main>

  <!-- Toast Notification Stack -->
  <aside class="toast-container" aria-live="polite">
    @for (toast of taskService.toasts(); track toast.id) {
      <div class="toast-item toast-{{ toast.type }}">
        <div class="toast-icon">
          @if (toast.type === 'success') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          } @else if (toast.type === 'error') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          }
        </div>
        <span class="toast-text">{{ toast.message }}</span>
        <button class="toast-close" (click)="taskService.removeToast(toast.id)" aria-label="Dismiss toast">
          &times;
        </button>
      </div>
    }
  </aside>
</div>
